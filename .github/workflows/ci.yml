name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
          - runner: windows-11-arm
            rid: win-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test the engine
        run: dotnet test --project tests/PaperKnife.Core.Tests/PaperKnife.Core.Tests.csproj -c Release

      - name: Build the app
        run: dotnet build src/PaperKnife.App/PaperKnife.App.csproj -c Release -r ${{ matrix.rid }}
